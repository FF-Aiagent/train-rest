name: TrainRest
options:
  bundleIdPrefix: app.trainrest
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  TrainRest:
    type: application
    platform: iOS
    sources:
      - TrainRest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.trainrest.TrainRest
        INFOPLIST_KEY_CFBundleDisplayName: Train / Rest
        INFOPLIST_KEY_NSHealthShareUsageDescription: Train / Rest reads workout, sleep, and heart data to suggest a training preference for today. It does not diagnose or treat conditions.
        INFOPLIST_KEY_NSCameraUsageDescription: Take a photo for your personal pain log. Photos stay on this device.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Choose a photo for your personal pain log. Photos stay on this device.
        CODE_SIGN_ENTITLEMENTS: TrainRest/Resources/TrainRest.entitlements
