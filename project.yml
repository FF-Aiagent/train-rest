name: TrainRest
options:
  bundleIdPrefix: app.trainrest
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  TrainRest:
    type: application
    platform: iOS
    sources:
      - path: TrainRest
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.trainrest.TrainRest
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TrainRest/Info.plist
        CODE_SIGN_ENTITLEMENTS: TrainRest/Resources/TrainRest.entitlements
        TARGETED_DEVICE_FAMILY: "1"
